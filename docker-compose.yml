# caudexbid — environnement Docker (à lancer depuis ce dossier)
#   docker compose up -d --build
#   docker compose exec app php artisan migrate --seed
# API : http://localhost:8088/api

x-laravel-env: &laravel-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-caudexbid}
  DB_USERNAME: ${DB_USERNAME:-caudexbid}
  DB_PASSWORD: ${DB_PASSWORD:-caudexbid}
  APP_URL: http://localhost:${APP_PORT:-8088}

services:
  app:
    build: ./Php
    container_name: caudexbid-app
    working_dir: /var/www/html
    volumes:
      - ./Laravel:/var/www/html
    environment: *laravel-env
    depends_on:
      mysql:
        condition: service_healthy

  # Clôture automatique des enchères (php artisan auctions:close chaque minute)
  scheduler:
    build: ./Php
    container_name: caudexbid-scheduler
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./Laravel:/var/www/html
    environment: *laravel-env
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: caudexbid-nginx
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - ./Laravel:/var/www/html:ro
      - ./Nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: caudexbid-mysql
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-caudexbid}
      MYSQL_USER: ${DB_USERNAME:-caudexbid}
      MYSQL_PASSWORD: ${DB_PASSWORD:-caudexbid}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
